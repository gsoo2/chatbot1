<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ketin 관리자</title>
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mute:#8b8b90;--line:#e9e9eb;--soft:#f3f3f4}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f5;--mute:#8e8e93;--line:#242426;--soft:#1a1a1c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 20px 60px;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font:italic 44px/1 Georgia,serif}h1 small{font:600 13px/1 inherit;font-style:normal;color:var(--mute);margin-left:10px;font-family:inherit}
h2{margin:0 0 12px;font-size:12px;letter-spacing:.12em;color:var(--mute);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tiles div{border:1px solid var(--line);border-radius:16px;padding:16px}
.tiles b{display:block;font:400 34px/1 Georgia,serif;font-variant-numeric:tabular-nums}.tiles span{font-size:12px;color:var(--mute)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600}td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td small{display:block;color:var(--mute);overflow-wrap:anywhere}
.off{opacity:.45}
form{display:grid;grid-template-columns:140px 1fr;gap:10px}
form .full{grid-column:1/-1}
@media (max-width:560px){form{grid-template-columns:1fr}}
input,select{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
button{font:inherit;font-weight:600;border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:12px;padding:11px 16px;cursor:pointer}
button.ghost{background:none;color:var(--fg);padding:6px 10px;font-size:13px}
#msg{color:var(--mute);min-height:1.5em;margin:0}
</style>
</head>
<body>
<main>
  <h1>ketin<small>관리자</small></h1>
  <section id="login">
    <h2>관리자 키</h2>
    <form id="keyForm"><input class="full" id="key" type="password" placeholder="서버를 켤 때 콘솔에 나온 키" autocomplete="off"><button class="full">들어가기</button></form>
  </section>
  <p id="msg"></p>
  <div id="panel" hidden style="display:contents">
    <section><h2>지금</h2><div class="tiles" id="tiles"></div></section>
    <section><h2>광고</h2><div class="wrap"><table>
      <thead><tr><th>자리</th><th>내용</th><th>노출</th><th>클릭</th><th>클릭률</th><th></th></tr></thead><tbody id="ads"></tbody></table></div></section>
    <section><h2>새 광고</h2>
      <form id="adForm">
        <select id="placement" aria-label="자리"><option value="home">홈 (그룹 목록)</option><option value="open">오픈채팅 목록</option><option value="chat">오픈채팅 방 안</option></select>
        <input id="title" maxlength="40" placeholder="제목 (40자)" required>
        <input class="full" id="body" maxlength="80" placeholder="설명 (80자, 선택)">
        <input class="full" id="link" maxlength="300" placeholder="눌렀을 때 열릴 주소 https://… (선택)">
        <button class="full">광고 올리기</button>
      </form>
    </section>
  </div>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let key='';try{key=sessionStorage.getItem('ketin.admin')||''}catch(e){}
const PLACE={home:'홈',open:'오픈채팅 목록',chat:'오픈채팅 방'};
async function call(path,method,body){
  const r=await fetch('/api/admin'+path,{method:method||'GET',headers:{'x-admin-key':key,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'요청이 실패했어요');return j;
}
async function load(){
  try{
    const d=await call('/overview');$('#login').hidden=true;$('#panel').hidden=false;$('#msg').textContent='';
    try{sessionStorage.setItem('ketin.admin',key)}catch(e){}
    const s=d.stats;
    $('#tiles').innerHTML=[['가입자',s.users],['그룹',s.groups],['오픈채팅',s.opens],['메시지',s.messages],['이번 케틴에 찍은 사진',s.shotsToday]].map(([l,v])=>`<div><b>${v.toLocaleString()}</b><span>${l}</span></div>`).join('');
    $('#ads').innerHTML=d.ads.map(a=>`<tr class="${a.active?'':'off'}"><td>${PLACE[a.placement]||esc(a.placement)}</td>
      <td><b>${esc(a.title)}</b><small>${esc(a.body)}</small><small>${esc(a.link)}</small></td>
      <td class="n">${a.impressions.toLocaleString()}</td><td class="n">${a.clicks.toLocaleString()}</td><td class="n">${a.impressions?(a.clicks/a.impressions*100).toFixed(1)+'%':'–'}</td>
      <td class="n"><button class="ghost" data-t="${a.id}">${a.active?'끄기':'켜기'}</button> <button class="ghost" data-d="${a.id}">삭제</button></td></tr>`).join('')||'<tr><td colspan="6">광고가 없어요.</td></tr>';
  }catch(e){$('#login').hidden=false;$('#panel').hidden=true;if(key)$('#msg').textContent=e.message}
}
$('#keyForm').onsubmit=e=>{e.preventDefault();key=$('#key').value.trim();load()};
$('#adForm').onsubmit=async e=>{e.preventDefault();
  try{await call('/ads','POST',{placement:$('#placement').value,title:$('#title').value,body:$('#body').value,link:$('#link').value});e.target.reset();$('#msg').textContent='광고를 올렸어요';load()}
  catch(err){$('#msg').textContent=err.message}};
const armed=new Set();
$('#ads').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  try{
    if(b.dataset.t)await call('/ads/'+b.dataset.t+'/toggle','POST');
    else if(b.dataset.d){if(!armed.has(b.dataset.d)){armed.add(b.dataset.d);b.textContent='정말 삭제';return}await call('/ads/'+b.dataset.d,'DELETE')}
    load();
  }catch(err){$('#msg').textContent=err.message}};
if(key)load();
</script>
</body>
</html>
