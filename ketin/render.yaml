# Render 무료 플랜용 설정. 저장소 루트가 아니라 ketin 폴더를 서비스 루트로 쓴다.
services:
  - type: web
    name: ketin
    runtime: node
    plan: free
    region: singapore
    rootDir: ketin
    buildCommand: npm ci --omit=dev
    startCommand: node --disable-warning=ExperimentalWarning server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: GM_CODE
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
